spring:
  application:
    name: ep-island
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studs?currentSchema=s507491}
    username: ${DB_USER:s507491}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 1
      connection-timeout: 10000
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:25074}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: always

ep-island:
  energy-coefficient: ${ENERGY_COEFFICIENT:14.2}
  simulate-accounting-failure: ${SIMULATE_ACCOUNTING_FAILURE:false}
  accounting-retry-interval-ms: ${ACCOUNTING_RETRY_INTERVAL_MS:30000}

logging:
  level:
    root: INFO
    ru.itmo.episland: INFO
