spring:
  application:
    name: ep-island
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studs?currentSchema=s507491}
    username: ${DB_USER:s507491}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 1
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:s507491}
    schemas: ${DB_SCHEMA:s507491}
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:25074}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: always

ep-island:
  energy-coefficient: ${ENERGY_COEFFICIENT:14.2}
  simulate-accounting-failure: ${SIMULATE_ACCOUNTING_FAILURE:false}
  accounting-retry-interval-ms: ${ACCOUNTING_RETRY_INTERVAL_MS:30000}
  live-updates-heartbeat-ms: ${LIVE_UPDATES_HEARTBEAT_MS:25000}

logging:
  level:
    root: INFO
    ru.itmo.episland: INFO
