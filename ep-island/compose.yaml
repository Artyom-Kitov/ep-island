services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${LOCAL_DB_NAME:-episland}
      POSTGRES_USER: ${LOCAL_DB_USER:-episland}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-episland}
    ports:
      - "${LOCAL_DB_PORT:-54329}:5432"
    volumes:
      - ep-island-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-episland} -d ${LOCAL_DB_NAME:-episland}"]
      interval: 3s
      timeout: 3s
      retries: 20

  application:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      PORT: 8080
      DB_URL: jdbc:postgresql://database:5432/${LOCAL_DB_NAME:-episland}
      DB_USER: ${LOCAL_DB_USER:-episland}
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-episland}
      SIMULATE_ACCOUNTING_FAILURE: ${SIMULATE_ACCOUNTING_FAILURE:-false}
      ACCOUNTING_RETRY_INTERVAL_MS: ${ACCOUNTING_RETRY_INTERVAL_MS:-10000}
    ports:
      - "${LOCAL_APP_PORT:-25074}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ep-island-postgres:
